<style>
/* Grade densa de frames sobre fundo escuro: a imagem carrega a pagina, o texto sai da frente. */
:root{
  color-scheme: dark;
  --fundo:#0b0b0c;
  --tile:#17171a;
  --texto:#f2f1ef;
  --fraco:#86848c;
  --linha:rgba(242,241,239,.1);
  --f:"Archivo","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:var(--f);font-weight:400;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:1.5px solid var(--texto);outline-offset:3px}
.wrap{max-width:1500px;margin:0 auto;padding:0 28px}

header.topo{padding:52px 0 26px}
h1{font-weight:500;font-size:clamp(22px,2.6vw,30px);letter-spacing:.01em;margin:0}
header.topo p{margin:7px 0 0;color:var(--fraco);font-size:14px;max-width:48ch}

nav.ix{position:sticky;top:0;z-index:6;background:var(--fundo);border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);padding:13px 0}
nav.ix .wrap{display:flex;gap:22px;flex-wrap:wrap;padding:0 28px}
nav.ix a{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fraco);text-decoration:none;transition:color .15s}
nav.ix a:hover{color:var(--texto)}

section.tema{padding:46px 0 0;scroll-margin-top:54px}
section.tema > h2{font-weight:500;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--texto);margin:0 0 2px}
section.tema > p.nota{margin:0 0 18px;color:var(--fraco);font-size:13.5px}
h3.sub{font-weight:400;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fraco);margin:26px 0 12px}

.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:18px 14px}
@media (max-width:620px){.grade{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px 10px}}

.frame{display:block;width:100%;text-align:left;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.tela-mini{display:block;position:relative;aspect-ratio:16/9;background:var(--tile);overflow:hidden;border-radius:2px}
.tela-mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.82;transition:opacity .35s ease,transform .6s ease}
.frame:hover .tela-mini img,.frame:focus-visible .tela-mini img{opacity:1;transform:scale(1.04)}
.tela-mini .vazio{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--fraco);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.tela-mini .pl{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:1px solid rgba(255,255,255,.8);border-radius:50%;background:rgba(0,0,0,.3);opacity:0;transition:opacity .25s}
.frame:hover .pl,.frame:focus-visible .pl{opacity:1}
.tela-mini .pl::after{content:"";position:absolute;left:13px;top:10px;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.frame .nome{display:block;margin-top:8px;font-size:12.5px;color:var(--fraco);line-height:1.3;transition:color .15s;overflow-wrap:anywhere}
.frame:hover .nome,.frame:focus-visible .nome{color:var(--texto)}

footer.pe{margin-top:64px;padding:24px 0 64px;border-top:1px solid var(--linha);color:var(--fraco);font-size:12.5px;letter-spacing:.04em}
footer.pe a{color:var(--texto)}

.luz{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(4,4,5,.94)}
.luz.on{display:flex}
.cx{width:100%;display:flex;flex-direction:column;gap:12px}
.cx.h{max-width:min(1180px,calc((100vh - 140px)*16/9))}
.cx.v{max-width:min(400px,calc((100vh - 140px)*9/16))}
.cx.a{max-width:620px}
.cx header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cx header b{font-weight:500;font-size:14px;letter-spacing:.06em}
.cx header button{background:none;border:1px solid rgba(242,241,239,.4);color:var(--texto);font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:7px 13px;border-radius:2px;cursor:pointer}
.cx header button:hover{background:var(--texto);color:var(--fundo)}
.tela{position:relative;background:#000;border-radius:2px;overflow:hidden}
.cx.h .tela{aspect-ratio:16/9}
.cx.v .tela{aspect-ratio:9/16}
.cx.a .tela{height:70px}
.tela iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.cx.a .tela iframe{position:static;height:70px}
.tela p{position:absolute;inset:0;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;color:var(--fraco);font-size:13px}
.cx .fora{margin:0;text-align:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.tela-mini img{transition:none}}
</style>

    <div class="tela" id="tela"></div>

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function grupos(t){ return t.grupos || [{nome:null,itens:t.itens||[]}]; }

var bloqueado=false, luz=document.getElementById("luz"), tela=document.getElementById("tela"), cx=document.getElementById("cx"), foco=null;

function abrir(titulo,id,fmt){
  foco=document.activeElement;
  cx.className="cx "+(fmt==="a"?"a":fmt==="v"?"v":"h");
  document.getElementById("luzt").textContent=titulo;
  document.getElementById("luzl").href="https://drive.google.com/file/d/"+id+"/view";
  tela.textContent="";
  if(bloqueado){ aviso(); }
  else{
    var f=el("iframe"); f.src="https://drive.google.com/file/d/"+id+"/preview";
    f.allow="autoplay; fullscreen"; f.allowFullscreen=true; f.title=titulo; tela.appendChild(f);
  }
  luz.classList.add("on"); document.getElementById("fechar").focus();
}
function aviso(){ tela.textContent=""; tela.appendChild(el("p",null,"O player não carrega aqui. Use o link abaixo para abrir no Drive.")); }
function fechar(){ luz.classList.remove("on"); tela.textContent=""; if(foco) foco.focus(); }
document.getElementById("fechar").addEventListener("click",fechar);
luz.addEventListener("click",function(e){ if(e.target===luz) fechar(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&luz.classList.contains("on")) fechar(); });
document.addEventListener("securitypolicyviolation",function(e){
  if(/frame/.test(e.violatedDirective||"")){ bloqueado=true; if(luz.classList.contains("on")) aviso(); }
});

(function(){

    var a=el("a",null,t.nome); a.href="#"+t.id; ix.appendChild(a);
    var s=el("section","tema"); s.id=t.id;
    s.appendChild(el("h2",null,t.nome));
    if(t.nota) s.appendChild(el("p","nota",t.nota));
    grupos(t).forEach(function(g){
      if(g.nome) s.appendChild(el("h3","sub",g.nome));
      var gr=el("div","grade");
      g.itens.forEach(function(it){
        var titulo=it[0], id=it[1], fmt=it[2]||"h";
        var bt=el("button","frame"); bt.type="button";
        var tm=el("span","tela-mini");
        if(fmt==="a"){ tm.appendChild(el("span","vazio","áudio")); }
        else{
          var img=document.createElement("img");
          img.src="https://lh3.googleusercontent.com/d/"+id+"=w500";
          img.alt=""; img.loading="lazy"; img.referrerPolicy="no-referrer";
          img.addEventListener("error",function(){ img.remove(); tm.insertBefore(el("span","vazio","vídeo"), tm.firstChild); });
          tm.appendChild(img);
        }
        tm.appendChild(el("span","pl"));
        bt.appendChild(tm);
        bt.appendChild(el("span","nome",titulo));
        bt.addEventListener("click",function(){ abrir(titulo + (g.nome?" · "+g.nome:""), id, fmt); });
        gr.appendChild(bt);
      });
      s.appendChild(gr);
    });
    main.appendChild(s);
  });
  var pe=document.getElementById("pe");
  pe.appendChild(document.createTextNode("Todo o material fica no Google Drive. "));
  var pl=el("a",null,"Abrir a pasta completa ↗");
